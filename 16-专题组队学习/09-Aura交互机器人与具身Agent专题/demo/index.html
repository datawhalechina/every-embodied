<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura 同家庭任务 · 完整同步回放</title>
<style>body{margin:0;background:#f3f5f8;color:#163242;font:16px/1.65 system-ui,sans-serif}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:25px}a{color:#087c95}video{width:100%;background:#101d25;border-radius:16px}section{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:white;padding:18px;border-radius:18px}button,select{padding:9px;border-radius:8px;border:1px solid #c8d4dd;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:440px;overflow:auto;font:13px/1.6 ui-monospace,monospace}.note{color:#526b78}#events{max-height:420px;overflow:auto}#events button{display:block;text-align:left;width:97%;background:white}#events button.active{background:#e2f6f6}@media(max-width:800px){section{grid-template-columns:1fr}}</style>
<main><h1>Aura → R1 家务 Agent：完整过程与相机反馈</h1><p><a href="../README.md">课程正文</a> · <a href="../视频目录.md">11 路完整视频</a> · <a href="../assets/evidence/household-proof.json">原生证明</a></p>
<p class="note">五路各 255.7 秒，含人物交互、三罐投放、返回与报告。片中标记检查点恢复边界；模型等待时物理暂停。人物为动画角色，语音为合成输入和报告；公开记录展示决策摘要与工具回执。</p>
<p><button id="play">同步播放</button><button id="pause">暂停</button><button id="restart">从头</button><span id="time">0.0 s</span> <select id="view"><option value="household-r1_head">R1 相机</option><option value="household-aura_head">Aura 相机</option><option value="household-global">全屋俯视</option><option value="household-robot">机器人接力</option></select></p>
<section><div class="panel"><h2>完整第三视角</h2><video id="observer" controls preload="metadata" playsinline></video></div><div class="panel"><h2>同步视角</h2><video id="robot" controls preload="metadata" muted playsinline></video></div></section>
<section style="margin-top:18px"><div class="panel"><h2>公开事件</h2><p>点击事件可跳到对应录像时刻。</p><div id="events"></div></div><div class="panel"><h2>决策摘要 · 工具 · 结果</h2><pre id="detail">加载中……</pre></div></section>
<p id="status" class="note"></p></main>
<script>
'use strict';
const $=id=>document.getElementById(id);let rows=[],media=[],selected=-1;
function show(i,seek){selected=i;const e=rows[i];$('detail').textContent=JSON.stringify(e,null,2);if(seek){$('observer').currentTime=Math.max(0,e.video_s||0);$('robot').currentTime=$('observer').currentTime}document.querySelectorAll('#events button').forEach((b,j)=>b.classList.toggle('active',j===i))}
function sync(){const a=$('observer'),b=$('robot');if(Math.abs(a.currentTime-b.currentTime)>.22)b.currentTime=a.currentTime;$('time').textContent=a.currentTime.toFixed(1)+' s';let i=-1;for(let j=0;j<rows.length;j++){if((rows[j].video_s||0)<=a.currentTime)i=j;else break}if(i>=0&&i!==selected)show(i,false)}
async function play(){try{await $('observer').play();await $('robot').play()}catch(e){$('status').textContent='请点击视频播放；浏览器可能要求先进行一次用户操作。'}}
async function init(){try{media=(await (await fetch('../media-manifest.json')).json()).videos;rows=await (await fetch('../assets/evidence/public-events.json')).json();rows.sort((a,b)=>(a.video_s||0)-(b.video_s||0));$('observer').src=media.find(r=>r.id==='household-observer').url;$('robot').src=media.find(r=>r.id==='household-r1_head').url;rows.forEach((e,i)=>{const b=document.createElement('button');b.textContent=(e.video_s||0).toFixed(1)+'s · '+(e.kind||'event')+' · '+(e.summary||e.tool||e.state||'').slice(0,90);b.onclick=()=>show(i,true);$('events').appendChild(b)});$('status').textContent='已加载 '+rows.length+' 条公开事件。视频从同仓 Release 加载；可随时切换俯视或 Aura 相机。';show(0,false)}catch(e){$('status').textContent='请用本专题自带静态服务打开页面；加载错误：'+e.message}}
$('play').onclick=play;$('pause').onclick=()=>{$('observer').pause();$('robot').pause()};$('restart').onclick=()=>{$('observer').currentTime=0;$('robot').currentTime=0};$('observer').addEventListener('timeupdate',sync);$('observer').addEventListener('seeked',sync);$('observer').addEventListener('pause',()=>$('robot').pause());$('observer').addEventListener('play',()=>{$('robot').play().catch(()=>{})});$('view').onchange=()=>{const t=$('observer').currentTime,playing=!$('observer').paused;$('robot').src=media.find(r=>r.id===$('view').value).url;$('robot').addEventListener('loadedmetadata',()=>{$('robot').currentTime=t;if(playing)$('robot').play().catch(()=>{})},{once:true})};init();
</script></html>
